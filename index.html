<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9ab3b3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="メンテナンスのタイミングと履歴を、やさしく管理するアプリ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" href="./assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="./styles.css">
  <title>そろそろ</title>
</head>
<body>
  <div class="app-shell" id="appShell" hidden>
    <header class="app-header">
      <div>
        <h1>そろそろ</h1>
        <p id="todayLabel" class="today-label"></p>
      </div>
      <div class="header-actions">
        <button class="icon-button add-button" id="addButton" aria-label="項目を追加">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="account-button" id="accountButton" aria-label="アカウント" hidden>
          <span id="accountInitial"></span>
        </button>
      </div>
    </header>

    <main>
      <div id="itemList" class="item-list" aria-live="polite"></div>
      <section id="emptyState" class="empty-state" hidden>
        <button class="empty-add" id="emptyAddButton" aria-label="最初の項目を追加">
          <span>＋</span>
        </button>
        <p>最初の項目をつくる</p>
      </section>
    </main>
  </div>

  <section class="auth-gate" id="authGate" hidden>
    <div class="auth-card">
      <h1>そろそろ</h1>
      <button class="google-button" id="googleSignInButton">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285f4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.32 2.98-7.41Z"/><path fill="#34a853" d="M12 22c2.7 0 4.97-.9 6.62-2.36l-3.24-2.54c-.9.6-2.05.96-3.38.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.62A10 10 0 0 0 12 22Z"/><path fill="#fbbc05" d="M6.39 13.93A6.02 6.02 0 0 1 6.08 12c0-.67.12-1.32.31-1.93V7.45H3.04A10 10 0 0 0 2 12c0 1.63.39 3.17 1.04 4.55l3.35-2.62Z"/><path fill="#ea4335" d="M12 5.94c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.63 9.63 0 0 0 12 2a10 10 0 0 0-8.96 5.45l3.35 2.62C7.18 7.7 9.39 5.94 12 5.94Z"/></svg>
        <span>Googleでログイン</span>
      </button>
    </div>
  </section>

  <div class="wrap" id="dataLoading" hidden aria-hidden="true">
    <div class="loading_box">
      <div class="loading_04"></div>
    </div>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>

  <template id="recordModalTemplate">
    <div class="modal-layer" data-modal>
      <section class="modal-card record-modal" role="dialog" aria-modal="true" aria-labelledby="recordTitle">
        <div class="modal-handle"></div>
        <div class="modal-heading">
          <div>
            <h2 id="recordTitle"></h2>
            <p id="recordItemMemo" class="item-note" hidden></p>
          </div>
          <button class="text-button" id="historyButton">履歴</button>
        </div>
        <label class="field">
          <span class="sr-only">実施日</span>
          <input id="recordDate" type="date" aria-label="実施日">
        </label>
        <label class="field">
          <span class="sr-only">メンテメモ</span>
          <textarea id="recordMemo" rows="3" placeholder="メンテメモ" aria-label="メンテメモ"></textarea>
        </label>
        <button class="primary-button" id="saveRecordButton">記録する</button>
      </section>
    </div>
  </template>

  <template id="itemModalTemplate">
    <div class="modal-layer" data-modal>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="itemModalTitle">
        <div class="modal-handle"></div>
        <h2 id="itemModalTitle">項目をつくる</h2>
        <form id="itemForm">
          <label class="field">
            <span class="sr-only">項目名</span>
            <input id="itemName" maxlength="40" autocomplete="off" required placeholder="項目名" aria-label="項目名">
          </label>
          <label class="field">
            <span class="sr-only">項目メモ</span>
            <textarea id="itemMemo" rows="2" maxlength="200" placeholder="項目メモ" aria-label="項目メモ"></textarea>
          </label>
          <div class="field interval-field">
            <div class="interval-heading">
              <span>間隔</span>
              <div class="interval-control">
                <input id="itemInterval" type="number" min="1" max="3650" inputmode="numeric" value="30" required>
                <span>日</span>
              </div>
            </div>
            <button id="itemLockButton" class="lock-toggle" type="button" aria-pressed="false" aria-label="上部に固定">
                <svg class="unlock-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 16C2 13.1716 2 11.7574 2.87868 10.8787C3.75736 10 5.17157 10 8 10H16C18.8284 10 20.2426 10 21.1213 10.8787C22 11.7574 22 13.1716 22 16C22 18.8284 22 20.2426 21.1213 21.1213C20.2426 22 18.8284 22 16 22H8C5.17157 22 3.75736 22 2.87868 21.1213C2 20.2426 2 18.8284 2 16Z"/>
                  <path class="soft" d="M6 10V8C6 4.68629 8.68629 2 12 2C14.7958 2 17.1449 3.91216 17.811 6.5"/>
                  <path class="soft" d="M12 14V18"/>
                </svg>
                <svg class="locked-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 16C2 13.1716 2 11.7574 2.87868 10.8787C3.75736 10 5.17157 10 8 10H16C18.8284 10 20.2426 10 21.1213 10.8787C22 11.7574 22 13.1716 22 16C22 18.8284 22 20.2426 21.1213 21.1213C20.2426 22 18.8284 22 16 22H8C5.17157 22 3.75736 22 2.87868 21.1213C2 20.2426 2 18.8284 2 16Z"/>
                  <path class="soft" d="M6 10V8C6 4.68629 8.68629 2 12 2C15.3137 2 18 4.68629 18 8V10"/>
                  <path class="soft" d="M12 14V18"/>
                </svg>
            </button>
          </div>
          <fieldset class="field display-options">
            <legend class="sr-only">カードに表示する日数</legend>
            <label><input id="itemShowElapsed" type="checkbox"><span>経過日数</span></label>
            <label><input id="itemShowRemaining" type="checkbox"><span>残り日数</span></label>
          </fieldset>
          <fieldset class="field color-fieldset">
            <legend class="sr-only">色</legend>
            <div id="colorPicker" class="color-picker"></div>
          </fieldset>
          <button class="primary-button" type="submit" id="saveItemButton">作成する</button>
          <button class="danger-button" type="button" id="deleteItemButton" hidden>この項目を削除</button>
        </form>
      </section>
    </div>
  </template>

  <template id="historyModalTemplate">
    <div class="modal-layer" data-modal>
      <section class="modal-card history-modal" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
        <div class="modal-handle"></div>
        <div class="modal-heading">
          <h2 id="historyTitle">履歴</h2>
          <button class="round-close" data-close aria-label="閉じる">×</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>
    </div>
  </template>

  <template id="accountModalTemplate">
    <div class="modal-layer" data-modal>
      <section class="modal-card account-modal" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
        <div class="modal-handle"></div>
        <h2 id="accountTitle">アカウント</h2>
        <p id="accountEmail" class="account-email"></p>
        <button class="secondary-button" id="signOutButton">ログアウト</button>
      </section>
    </div>
  </template>

  <script src="./app.js" type="module"></script>
</body>
</html>
